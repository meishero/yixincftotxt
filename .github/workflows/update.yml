name: Update CF Nodes


on:

  schedule:

    # 每20分钟执行
    - cron: "*/20 * * * *"

  workflow_dispatch:


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate nodes
        run: |
          python3 update.py


      - name: Commit
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add nodes.txt


          git commit -m "update nodes" || exit 0


          git push
